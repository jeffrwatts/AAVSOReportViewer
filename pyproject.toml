[project]
name = "aavso-viewer"
version = "0.1.0"
description = "Standalone viewer for AAVSO Extended-format photometry reports and VPhot General Exports"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7",
    "pandas>=2.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "requests>=2.31",
]

[project.scripts]
aavso-viewer = "aavso_viewer.app:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aavso_viewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
