[project]
name = "photometry-workbench"
version = "1.0.0"
description = "Inspect, transform and prepare VPhot photometry reports for submission to the AAVSO, including transformed ensembles"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jeff Watts" }]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7",
    "pandas>=2.0",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "requests>=2.31",
]

[project.urls]
Repository = "https://github.com/jeffrwatts/PhotometryWorkbench"

[project.scripts]
photometry-workbench = "photometry_workbench.app:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
notebook = ["jupyter"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/photometry_workbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
