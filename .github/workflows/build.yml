# Builds the standalone app on macOS and Windows with packaging/build.py (tests, build,
# self-test, zip). A pushed tag like v1.0.1 also makes a draft GitHub release with both
# zips attached, to check and publish by hand. Run it from the Actions tab to build
# without releasing.

name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[build,dev]"

      - name: Check the tag matches the version and the README's pipx command
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import os, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag} doesn't match pyproject.toml version {version}")
          if f"pipx install git+https://github.com/jeffrwatts/PhotometryWorkbench@{tag}\n" not in open("README.md", encoding="utf-8").read():
              raise SystemExit(f"README's pipx install command doesn't name {tag}")

      - name: Test
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build, self-test and zip
        run: python packaging/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}
          path: dist/PhotometryWorkbench-*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: zips
          merge-multiple: true

      - name: Draft the release
        run: >
          gh release create "$GITHUB_REF_NAME" zips/*.zip
          --repo "$GITHUB_REPOSITORY" --draft --generate-notes
          --title "Photometry Workbench ${GITHUB_REF_NAME#v}"
        env:
          GH_TOKEN: ${{ github.token }}
